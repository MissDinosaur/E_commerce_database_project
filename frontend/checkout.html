<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Checkout</h2>
    <p>Completing your purchase...</p>

    <script>
        document.addEventListener("mousemove", async function(event) {
            let customer_id = localStorage.getItem("customer_id");

            if (customer_id) {
                await fetch("/api/log_cursor", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ x: event.clientX, y: event.clientY, customer_id: customer_id })
                });
            }
        });

        async function completePurchase() {
            let params = new URLSearchParams(window.location.search);
            let productId = params.get("product");
            let customer_id = localStorage.getItem("customer_id");
    
            let response = await fetch("/api/checkout", {  // Checkout API
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ customer_id: customer_id, product_id: productId })
            });
    
            let result = await response.json();
            if (result.success) {
                alert("Purchase successful!");
                runFraudCheck();  // Trigger Fraud Detection
            } else {
                alert("Purchase failed!");
            }
        }
    
        async function runFraudCheck() {
            let response = await fetch("/api/fraud_detection");  // Fraud API
            let result = await response.json();
            console.log("Fraud Check Result:", result);
        }
    
        completePurchase();
    </script>
</body>
</html>
