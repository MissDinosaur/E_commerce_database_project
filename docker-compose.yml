version: '3.8'

services:
  # 1️⃣ Start PostgreSQL
  postgres_db:
    build:
      context: ./databases/postgres
      dockerfile: Dockerfile
    container_name: postgres
    restart: always  # Ensures database doesn't crash
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2️⃣ Start MongoDB
  mongo_db:
    build:
      context: ./databases/mongo
      dockerfile: Dockerfile
    container_name: mongo_db
    restart: always  # Ensures database doesn't crash
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./databases/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3️⃣ Start Neo4j
  neo4j_db:
    build:
      context: ./databases/neo4j
      dockerfile: Dockerfile
    container_name: neo4j_db
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ./databases/neo4j/init.cypher:/var/lib/neo4j/import/init.cypher
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "MATCH () RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4️⃣ Run Data Ingestion (after databases are up)
  data_ingestion:
    build:
      context: ./data_pipeline
      dockerfile: Dockerfile
    container_name: data_ingestion
    restart: on-failure
    volumes:
      - ./data_pipeline:/app
      - ./data_pipeline/data/olist.sqlite:/app/data/olist.sqlite
    command: >
      sh -c "sleep 10 &&
           pip install tqdm &&
           python ingestion/postgres_ingest.py &&
           python ingestion/mongo_ingest.py &&
           python ingestion/neo4j_ingest.py"
    depends_on:
      postgres_db:
        condition: service_healthy
      mongo_db:
        condition: service_healthy
      neo4j_db:
        condition: service_healthy
    networks:
      - app_network

  # 5️⃣ Train ML Model (after data ingestion is complete)
  model_training:
    build:
      context: ./data_pipeline
      dockerfile: Dockerfile
    container_name: model_training
    restart: on-failure
    volumes:
      - ./data_pipeline:/app
    command: python ml/train_model.py
    depends_on:
      data_ingestion:
        condition: service_completed_successfully
    networks:
      - app_network

